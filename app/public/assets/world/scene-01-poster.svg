<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="72%" cy="48%" r="60%">
      <stop offset="0" stop-color="#24506B"/>
      <stop offset="1" stop-color="#10222E"/>
